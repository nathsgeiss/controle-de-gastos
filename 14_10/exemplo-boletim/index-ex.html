<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="boletim">

        <header class="topo">
            <h1>Boletim — Matemática</h1>
        </header>

        <form class="formulario">
            <h2>Nova nota</h2>
            <p>
                <label for="aluno">Aluno</label>
                <input type="text" id="aluno" class="campo-aluno">
            </p>
            <p>
                <label for="nota">Nota</label>
                <input type="number" id="nota" class="campo-nota" min="0" max="10" step="0.5">
            </p>
            <button type="submit">Lançar nota</button>
            <button type="button" class="botao-remover">Remover última</button>
        </form>

        <section class="resumo">
            <h2>Resumo</h2>
            <p>Média da turma: <strong class="media">—</strong></p>
            <p>Maior nota: <strong class="maior">—</strong></p>
            <p>Menor nota: <strong class="menor">—</strong></p>
        </section>

        <section class="notas">
            <table>
                    <caption>Notas da turma</caption>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Aluno</th>
                            <th>Nota</th>
                        </tr>
                    </thead>
                    <tbody class="linhas"></tbody>
                    <tfoot>
                        <tr>
                            <th colspan="2">Média</th>
                            <td class="media-rodape">—</td>
                        </tr>
                    </tfoot>
            </table>
        </section>

    </main>

</body>

</html>
