<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de gatos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
       <main class="lista-de-gastos">

        <header class="topo">
            <h1>Lista de Gastos</h1>
        </header>

        <form class="formulario">
            <h2>Novo gasto</h2>
            <p>
                <label for="produto">Produto</label>
                <input type="text" id="produto" class="campo-produto">
            </p>
            <p>
                <label for="Valor">Valor</label>
                <input type="number" id="Valor" class="campo-valor" min="0" max="10" step="0.5">
            </p>
            <button type="submit">Lançar compra</button>
            <button type="button" class="botao-remover">Remover última</button>
        </form>

        <section class="resumo">
            <h2>Resumo</h2>
            <p>Média de gastos: <strong class="media">—</strong></p>
            <p>Maior gasto: <strong class="maior">—</strong></p>
            <p>Menor gasto: <strong class="menor">—</strong></p>
        </section>

</body>
